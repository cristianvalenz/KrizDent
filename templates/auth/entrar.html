<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · KrizDent</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/krisdent.css') }}" rel="stylesheet">
</head>
<body class="kd-acceso">

<main class="kd-acceso-caja">
  <div class="kd-acceso-marca">
    <img src="{{ url_for('static', filename='img/logo-transparente.png') }}" alt="" class="kd-acceso-logo">
    <div>
      <strong>KrizDent</strong>
      <small>Centro odontológico</small>
    </div>
  </div>

  <div class="card">
    <div class="card-body">
      <h1 class="h5 mb-1">Iniciar sesión</h1>
      <p class="text-muted small mb-3">Entra con el correo y la contraseña de tu clínica.</p>

      {% include 'partials/_flash.html' %}

      <form method="post" novalidate>
        <input type="hidden" name="siguiente" value="{{ siguiente }}">

        <div class="mb-3">
          <label class="form-label" for="email">Correo</label>
          <input class="form-control" type="email" id="email" name="email"
                 value="{{ email }}" autocomplete="username" required autofocus>
        </div>

        <div class="mb-3">
          <label class="form-label" for="clave">Contraseña</label>
          <input class="form-control" type="password" id="clave" name="clave"
                 autocomplete="current-password" required>
        </div>

        <button class="btn btn-primary w-100" type="submit">Entrar</button>
      </form>
    </div>
  </div>

  <p class="kd-acceso-pie">
    ¿Olvidaste tu contraseña? Pídele al titular de tu clínica que te la reinicie.
  </p>
</main>

</body>
</html>
