<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/krisdent.css') }}" rel="stylesheet">
</head>
<body class="kd-acceso">

<main class="kd-acceso-caja">
  {# Sin marca de ninguna clínica: la del cliente aparece recién al entrar. #}
  <div class="kd-acceso-marca">
    <span class="kd-acceso-icono-sistema" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
        <path d="M12 3c-2 0-2.6 1-4.2 1C6 4 4 5.4 4 9c0 4.6 2.2 12 4 12 1.5 0 1.6-4 4-4s2.5 4 4 4c1.8 0 4-7.4 4-12 0-3.6-2-5-3.8-5C14.6 4 14 3 12 3Z"
              stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      </svg>
    </span>
    <small>Sistema de gestión odontológica</small>
  </div>

  <div class="card">
    <div class="card-body">
      <h1 class="h5 mb-1">Iniciar sesión</h1>
      <p class="text-muted small mb-3">Entra con tu usuario y contraseña.</p>

      {% include 'partials/_flash.html' %}

      <form method="post" novalidate>
        <input type="hidden" name="siguiente" value="{{ siguiente }}">

        <div class="mb-3">
          <label class="form-label" for="usuario">Usuario</label>
          <input class="form-control" type="text" id="usuario" name="usuario"
                 value="{{ usuario }}" autocomplete="username"
                 autocapitalize="none" spellcheck="false" required autofocus>
        </div>

        <div class="mb-3">
          <label class="form-label" for="clave">Contraseña</label>
          <input class="form-control" type="password" id="clave" name="clave"
                 autocomplete="current-password" required>
        </div>

        <button class="btn btn-primary w-100" type="submit">Entrar</button>
      </form>
    </div>
  </div>

  <p class="kd-acceso-pie">
    ¿Olvidaste tu contraseña? Pídele a quien administra tu cuenta que te la reinicie.
  </p>
</main>

</body>
</html>
