<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}KrizDent{% endblock %} · KrizDent</title>

  <!-- Bootstrap 5 desde CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Tipografías: Instrument Sans para la interfaz, IBM Plex Mono para datos -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Estilos propios (van después de Bootstrap para poder sobrescribirlo) -->
  <link href="{{ url_for('static', filename='css/krisdent.css') }}" rel="stylesheet">
</head>
<body>

<!-- ================= BARRA LATERAL ================= -->
<nav class="kd-sidebar">
  <a class="kd-marca" href="{{ url_for('dashboard.index') }}">
    <img src="{{ url_for('static', filename='img/logo-transparente.png') }}" alt="KrizDent" class="kd-marca-logo">
    <span>
      KrizDent
      <small>Centro odontológico</small>
    </span>
  </a>

  <div class="kd-nav">
    {% set r = request.endpoint or '' %}
    <a href="{{ url_for('dashboard.index') }}" class="{{ 'activo' if r.startswith('dashboard') }}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M4 13h6V4H4v9Zm0 7h6v-5H4v5Zm10 0h6v-9h-6v9Zm0-16v5h6V4h-6Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      </svg>
      Panel
    </a>
    <a href="{{ url_for('pacientes.lista') }}" class="{{ 'activo' if r.startswith('pacientes') }}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="8" r="3.4" stroke="currentColor" stroke-width="1.6"/>
        <path d="M5 20c0-3.6 3.1-5.6 7-5.6s7 2 7 5.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      Pacientes
    </a>
    <a href="{{ url_for('citas.lista') }}" class="{{ 'activo' if r.startswith('citas') }}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="3.5" y="5" width="17" height="15" rx="2.2" stroke="currentColor" stroke-width="1.6"/>
        <path d="M3.5 10h17M8 3.5v3M16 3.5v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      Agenda
    </a>
    <a href="{{ url_for('finanzas.lista') }}" class="{{ 'activo' if r.startswith('finanzas') }}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.6"/>
        <path d="M12 7.5v9M9.3 15c0 1.1 1.2 2 2.7 2s2.7-.8 2.7-1.8c0-2.4-5.4-1.2-5.4-3.4 0-1 1.2-1.8 2.7-1.8s2.7.7 2.7 1.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      Presupuestos
    </a>
    <a href="{{ url_for('recetas.lista') }}" class="{{ 'activo' if r.startswith('recetas') }}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M6 3.5h9l4 4V20a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4.5a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M14.5 3.5V8h4.5" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M8 13h8M8 16.5h5.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      Recetas
    </a>
    <a href="{{ url_for('almacen.lista') }}" class="{{ 'activo' if r.startswith('almacen') }}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M3.5 8.5 12 4l8.5 4.5V19a1 1 0 0 1-1 1H4.5a1 1 0 0 1-1-1V8.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M8.5 20v-6.5h7V20" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      </svg>
      Almacén
    </a>
    <a href="{{ url_for('reportes.index') }}" class="{{ 'activo' if r.startswith('reportes') }}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M4 20V10M11 20V4M18 20v-7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      Reportes
    </a>
    <a href="{{ url_for('profesionales.lista') }}" class="{{ 'activo' if r.startswith('profesionales') }}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="8.5" cy="8" r="3" stroke="currentColor" stroke-width="1.6"/>
        <circle cx="16" cy="9.5" r="2.3" stroke="currentColor" stroke-width="1.6"/>
        <path d="M3.5 19.5c0-3 2.3-5 5-5s5 2 5 5M14 15.2c2.2.3 3.8 1.9 3.8 4.3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      Profesionales
    </a>
  </div>

  <div class="kd-sidebar-pie">
    Prototipo · Flask + Supabase
  </div>
</nav>

<!-- ================= CONTENIDO ================= -->
<main class="kd-contenido">
  {% include 'partials/_flash.html' %}
  {% block contenido %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
