{% extends 'base.html' %}
{% block titulo %}Error {{ codigo }}{% endblock %}

{% block contenido %}
<div class="card" style="max-width:520px;margin:60px auto">
  <div class="card-body text-center py-5">
    <p class="dato" style="font-size:2.6rem;color:var(--kd-mineral);margin:0">{{ codigo }}</p>
    <h1 class="h5 mt-2">{{ titulo }}</h1>
    <p class="text-muted small">{{ detalle }}</p>
    <a class="btn btn-primary btn-sm mt-2" href="{{ url_for('dashboard.index') }}">Volver al panel</a>
  </div>
</div>
{% endblock %}
